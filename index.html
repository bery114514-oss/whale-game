<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04101d">
<title>鲸鱼娘 · 深海米饭 Roguelite</title>

<!-- ===== PWA / 添加到主屏幕 ===== -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">

<!-- iOS 全屏 + 状态栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鲸鱼娘">

<!-- 通用 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="鲸鱼娘">
<meta name="description" content="带着鲸鱼娘在深海里游，自动喷水打怪，吃米饭升级喵。">
<meta name="format-detection" content="telephone=no">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="browsermode" content="application">
<meta name="x5-page-mode" content="app">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    height:100dvh;   /* iOS 全屏时更准 */
    overflow:hidden;background:#04101d;
  }
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;color:#eaf6ff;
  }
  canvas{display:block;position:fixed;inset:0}

  .layer{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 36%,rgba(12,56,100,.7),rgba(2,8,18,.94));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .layer.show{opacity:1;pointer-events:auto}

  .panel{
    width:min(600px,100%);
    max-width:100%;
    max-height:100%;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:clamp(20px,3.4vw,32px);
    border-radius:24px;
    background:linear-gradient(160deg,rgba(24,62,104,.86),rgba(10,28,52,.94));
    border:1px solid rgba(120,200,255,.22);
    box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(160,220,255,.18);
    text-align:center;
    transform:translateY(10px) scale(.985);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .layer.show .panel{transform:translateY(0) scale(1)}

  .badge{font-size:clamp(34px,8vw,50px);line-height:1;display:block;margin-bottom:8px}
  h1{
    font-size:clamp(19px,4.2vw,27px);font-weight:800;letter-spacing:.02em;margin-bottom:8px;
    background:linear-gradient(100deg,#9fe4ff,#fff 45%,#7fc4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:clamp(12.5px,2.5vw,14.5px);line-height:1.8;color:#a9cbe6;margin-bottom:16px}

  .keys{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-bottom:18px;width:100%;min-width:0;
  }
  .key{
    font-size:11.5px;padding:5px 10px;border-radius:999px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:rgba(120,200,255,.1);border:1px solid rgba(120,200,255,.22);
    color:#bfe2fb;white-space:nowrap;
  }
  .key b{color:#fff;font-weight:700}

  .stats{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 18px}
  .stats.show{display:grid}
  .stat{padding:11px 4px;border-radius:14px;background:rgba(120,200,255,.08);border:1px solid rgba(120,200,255,.16)}
  .stat .v{font-size:clamp(16px,3.4vw,21px);font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .stat .k{font-size:10.5px;color:#8fb4d0;margin-top:3px;letter-spacing:.04em}

  button{
    font:inherit;cursor:pointer;border:0;
    padding:13px 36px;border-radius:999px;
    font-size:clamp(14px,3vw,16px);font-weight:800;letter-spacing:.04em;
    color:#04202f;
    background:linear-gradient(135deg,#b8f0ff,#66c8ff 55%,#3aa4f0);
    box-shadow:0 10px 26px rgba(60,170,255,.36),inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .13s ease,box-shadow .2s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 15px 34px rgba(60,170,255,.5),inset 0 1px 0 rgba(255,255,255,.8)}
  button:active{transform:translateY(1px) scale(.98)}
  button.ghost{
    background:rgba(120,200,255,.12);color:#bfe2fb;
    box-shadow:none;border:1px solid rgba(120,200,255,.28);
    padding:10px 22px;font-size:13px;
  }

  .hint{margin-top:13px;font-size:11.5px;color:#6f96b4;line-height:1.65}
  .buildwrap{margin-top:12px;text-align:left}
  .buildlabel{font-size:10.5px;color:#7fa3be;letter-spacing:.12em;margin-bottom:6px}
  .mtags{display:flex;flex-wrap:wrap;gap:5px}
  .mtag{
    font-size:11px;padding:4px 9px;border-radius:8px;
    background:rgba(120,200,255,.1);border:1px solid rgba(120,200,255,.2);
    color:#cfe6f7;
  }
  .mtag b{color:#ffd98a}

  /* ---- 局外永久升级 ---- */
  .meta{margin-top:16px;padding-top:14px;border-top:1px solid rgba(120,200,255,.14)}
  .meta-title{font-size:12px;color:#8fb4d0;letter-spacing:.1em;margin-bottom:9px}
  .meta-list{display:grid;gap:7px}
  .meta-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 12px;border-radius:13px;
    background:rgba(120,200,255,.06);border:1px solid rgba(120,200,255,.13);
    font-size:12.5px;text-align:left;
  }
  .meta-row .mi{font-size:16px;width:22px;text-align:center}
  .meta-row .mn{flex:1;color:#cfe6f7}
  .meta-row .mn small{display:block;color:#7fa3be;font-size:10.5px;margin-top:1px}
  .meta-row .mb{
    border:0;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:800;
    background:rgba(140,215,255,.18);color:#cfeeff;cursor:pointer;
    box-shadow:none;letter-spacing:0;
  }
  .meta-row .mb:hover{background:rgba(140,215,255,.3);transform:none}
  .meta-row .mb:disabled{opacity:.35;cursor:not-allowed}
  .coins{color:#ffd98a;font-weight:800}
  .reset-btn{
    display:block;margin:14px auto 0;
    padding:8px 20px;border-radius:10px;
    font-size:12px;font-weight:800;letter-spacing:.05em;
    background:rgba(255,110,140,.16);
    border:1px solid rgba(255,120,150,.45);
    color:#ffc2cf;box-shadow:none;
  }
  .reset-btn:hover{
    background:rgba(255,110,140,.22);
    border-color:rgba(255,140,165,.6);
    transform:none;box-shadow:none;
  }
  .reset-btn.confirm{
    background:rgba(255,70,100,.35);
    border-color:#ff6b8a;color:#fff;
    animation:pulseWarn .9s ease-in-out infinite;
  }
  @keyframes pulseWarn{
    0%,100%{box-shadow:0 0 0 0 rgba(255,90,120,.5)}
    50%{box-shadow:0 0 0 8px rgba(255,90,120,0)}
  }

  /* ---- 升级三选一 ---- */
  #levelup .panel{width:min(880px,100%)}
  .lu-title{font-size:clamp(15px,3.2vw,19px);font-weight:800;color:#bff0ff;margin-bottom:4px}
  .lu-sub{font-size:12px;color:#8fb4d0;margin-bottom:16px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:620px){.cards{grid-template-columns:1fr}}

  .card{
    position:relative;
    padding:16px 13px 14px;border-radius:18px;cursor:pointer;
    background:linear-gradient(165deg,rgba(40,86,136,.6),rgba(16,38,66,.85));
    border:1px solid rgba(120,200,255,.2);
    transition:transform .16s cubic-bezier(.2,.9,.3,1.4),border-color .2s,box-shadow .2s;
    text-align:center;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(150,230,255,.65);
    box-shadow:0 16px 40px rgba(30,120,210,.4),inset 0 1px 0 rgba(180,235,255,.25);
  }
  .card .ic{font-size:clamp(24px,5vw,32px);line-height:1;margin-bottom:8px}
  .card .nm{font-size:clamp(13px,2.7vw,15px);font-weight:800;color:#fff;margin-bottom:6px}
  .card .ds{font-size:11.5px;line-height:1.6;color:#a9cbe6;min-height:2.6em}
  .card .lv{
    margin-top:9px;font-size:10.5px;color:#7fa3be;letter-spacing:.06em;
  }
  .card .lv b{color:#9fe4ff}
  .card .num{
    position:absolute;top:8px;left:10px;
    font-size:10px;font-weight:800;color:#6f96b4;
    border:1px solid rgba(120,200,255,.25);border-radius:6px;
    padding:1px 5px;
  }
  .card.maxed{opacity:.5}
  .card .rar{
    position:absolute;top:8px;right:10px;
    font-size:9.5px;font-weight:800;letter-spacing:.1em;
  }
  .card .ds .dimg{color:#7fa3be;font-size:10.5px}
  .card.r3{
    background:linear-gradient(165deg,rgba(120,88,40,.5),rgba(30,24,14,.9));
    border-color:rgba(255,209,102,.45);
  }
  .card.r3:hover{border-color:#ffd166;box-shadow:0 16px 44px rgba(255,180,60,.42),inset 0 1px 0 rgba(255,230,180,.3)}
  .card.r2{
    background:linear-gradient(165deg,rgba(40,90,120,.55),rgba(14,34,58,.9));
  }

  /* ---- 移动摇杆提示 ---- */

  /* 窄屏 / 手机竖屏 */
  /* 暂停按钮（游戏内，右上角） */
  #pauseBtn{
    position:fixed;z-index:9;
    top:max(14px,env(safe-area-inset-top));
    right:max(14px,env(safe-area-inset-right));
    width:42px;height:42px;border-radius:12px;
    display:none;align-items:center;justify-content:center;
    background:rgba(18,45,75,.72);
    border:1px solid rgba(120,200,255,.32);
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    cursor:pointer;color:#bfe2fb;font-size:17px;line-height:1;
    transition:background .18s, transform .12s;
  }
  #pauseBtn:hover{background:rgba(30,70,110,.85);border-color:rgba(150,225,255,.6)}
  #pauseBtn:active{transform:scale(.93)}
  #pauseBtn.show{display:flex}

  /* ---- 触屏设备适配 ---- */
  @media (pointer: coarse), (hover: none) {
    /* 暂停按钮加大到好点的尺寸 */
    #pauseBtn{
      width:54px;height:54px;border-radius:16px;font-size:21px;
      top:max(16px,env(safe-area-inset-top));
      right:max(16px,env(safe-area-inset-right));
    }
    /* 升级卡：整屏单列、卡片加大 */
    .cards{grid-template-columns:1fr;gap:10px}
    .card{padding:16px 14px}
    .card .ic{font-size:26px;margin-bottom:6px}
    .card .nm{font-size:15px}
    .card .ds{font-size:12px;min-height:0}
    /* 主菜单按钮加大 */
    button{padding:14px 34px;font-size:15px}
    .meta-row .mb{padding:9px 14px;font-size:12px}
  }

  /* 触屏操作提示 */
  #touchHint{
    position:fixed;z-index:8;left:50%;
    bottom:max(16px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    padding:6px 14px;border-radius:999px;
    font-size:11.5px;color:rgba(190,225,245,.75);
    background:rgba(8,24,42,.55);
    border:1px solid rgba(120,200,255,.18);
    pointer-events:none;display:none;
    transition:opacity .4s;
  }
  @media (pointer: coarse), (hover: none) { #touchHint { display:block; } }
  #touchHint.hide{opacity:0}

  /* ===== 强制横屏：竖屏时完全拦截，不给玩 ===== */
  #rotateTip{
    position:fixed;inset:0;z-index:9999;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(160deg,#0a1f33,#04101d);
    color:#bfe2fb;text-align:center;padding:24px;
    overflow:hidden;touch-action:none;
  }
  #rotateTip .ic{font-size:64px;line-height:1;animation:rotatePhone 2.2s ease-in-out infinite}
  #rotateTip .tt{font-size:19px;font-weight:800;color:#fff;letter-spacing:.02em}
  #rotateTip .dd{font-size:13.5px;color:#8fb4d0;line-height:1.75}
  #rotateTip .dd b{color:#9fe4ff}
  @keyframes rotatePhone{
    0%,42%{transform:rotate(0deg)}
    58%,100%{transform:rotate(-90deg)}
  }
  /* 触屏设备竖屏时：强制遮挡，游戏不可玩 */
  @media (orientation: portrait) and (max-width: 560px), (pointer: coarse) and (orientation: portrait) {
    #rotateTip{display:flex}
    html,body{overflow:hidden}
    /* 用 display:none 彻底移出渲染，比 visibility 更可靠 */
    #c, #pauseBtn, #touchHint{visibility:hidden !important}
    #overlay, #levelup{display:none !important}
  }

  /* 手机横屏：宽而矮，面板加宽、整体压缩
     同时用 (pointer:coarse) 和 (hover:none) 兜底，兼容各种设备判定 */
  @media (orientation: landscape) and (max-height: 560px) {
    .layer{padding:8px 14px}
    .panel{
      width:min(920px, 100%);
      max-height:calc(100vh - 16px);
      padding:10px 18px 12px;
      border-radius:18px;
      /* 横屏两栏：左标题按钮，右商店 */
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto auto auto auto;
      column-gap:22px;
      align-content:start;
    }
    /* 左栏元素 */
    .badge{grid-column:1;grid-row:1}
    h1{grid-column:1;grid-row:2}
    .sub{grid-column:1;grid-row:3}
    #ovKeys{grid-column:1;grid-row:4}
    #ovBtn{grid-column:1;grid-row:5;justify-self:center}
    #ovHint{grid-column:1;grid-row:6}
    /* 右栏：商店占满右侧 */
    .meta{
      grid-column:2;
      grid-row:1 / span 6;
      margin-top:0;padding-top:0;border-top:0;
      align-self:start;
    }
    /* 结算统计也放左栏 */
    .stats{grid-column:1;grid-row:5}
    /* 暂停/结算时隐藏商店 -> 单栏居中 */
    .panel.no-meta{grid-template-columns:1fr}
    .panel.no-meta .meta{display:none !important}
    .badge{font-size:24px;margin-bottom:2px}
    h1{font-size:17px;margin-bottom:3px}
    .sub{font-size:11px;line-height:1.5;margin-bottom:8px}
    .keys{margin-bottom:8px;gap:5px}
    .key{font-size:10px;padding:3px 9px}
    button{padding:9px 28px;font-size:13px}
    .hint{margin-top:6px;font-size:10px}
    /* 商店：横屏时两列、更紧凑 */
    .meta{margin-top:8px;padding-top:7px}
    .meta-title{font-size:10.5px;margin-bottom:6px}
    .meta-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .meta-row{padding:6px 9px;font-size:11px;border-radius:10px}
    .meta-row .mi{font-size:13px;width:16px}
    .meta-row .mn small{font-size:9.5px}
    .meta-row .mb{padding:5px 10px;font-size:10.5px}
    .reset-btn{margin-top:7px;padding:5px 14px;font-size:10.5px}
    /* 升级卡：横屏三列并排 */
    .cards{grid-template-columns:repeat(3,1fr);gap:8px}
    .card{padding:10px 8px}
    .card .ic{font-size:20px;margin-bottom:3px}
    .card .nm{font-size:12.5px;margin-bottom:4px}
    .card .ds{font-size:10px;min-height:0;line-height:1.5}
    .card .lv{font-size:9px;margin-top:4px}
    .lu-title{font-size:14px}
    .lu-sub{font-size:10.5px;margin-bottom:8px}
  }

  @media (max-width: 560px) {
    .panel{padding:16px 14px;border-radius:20px;width:100%}
    .keys{gap:4px;margin-bottom:12px}
    .key{font-size:10px;padding:4px 7px}
    h1{font-size:17px;letter-spacing:0}
    .sub{font-size:12px;line-height:1.7;margin-bottom:12px}
    .keys{gap:5px;margin-bottom:14px}
    .key{font-size:10.5px;padding:4px 8px}
    button{padding:11px 26px;font-size:13.5px}
    .meta{margin-top:12px;padding-top:11px}
    .meta-row{padding:7px 9px;font-size:11.5px;gap:7px}
    .meta-row .mi{font-size:14px;width:18px}
    .meta-row .mn small{font-size:9.5px}
    .meta-row .mb{padding:5px 9px;font-size:10.5px}
    .stats{grid-template-columns:repeat(2,1fr);gap:7px}
    .stat{padding:9px 3px}
    .stat .v{font-size:17px}
    .stat .k{font-size:9.5px}
    .cards{grid-template-columns:1fr;gap:8px}
    .card{padding:12px 10px;border-radius:14px}
    .card .ic{font-size:20px;margin-bottom:5px}
    .card .nm{font-size:13px}
    .card .ds{font-size:11px;min-height:0}
    .card .lv{font-size:10px;margin-top:6px}
    .badge{font-size:30px}
    .hint{font-size:10.5px}
  }

  /* 横屏低高度：进一步压缩，但不隐藏商店 */
  @media (max-height: 520px) and (orientation: landscape) {
    .layer{padding:6px 12px}
    .panel{padding:8px 16px 10px;border-radius:16px}
    .badge{font-size:20px;margin-bottom:0}
    h1{font-size:15px;margin-bottom:2px}
    .sub{font-size:10.5px;line-height:1.4;margin-bottom:6px}
    .keys{margin-bottom:6px}
    .key{font-size:9.5px;padding:3px 8px}
    button{padding:8px 24px;font-size:12.5px}
    .hint{margin-top:5px;font-size:9.5px}
    .meta{margin-top:6px;padding-top:6px}
    .meta-title{font-size:10px;margin-bottom:4px}
    .meta-list{gap:4px}
    .meta-row{padding:5px 8px;font-size:10.5px}
    .meta-row .mn small{font-size:9px}
    .meta-row .mb{padding:4px 8px;font-size:10px}
    .reset-btn{margin-top:5px;padding:4px 12px;font-size:10px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pauseBtn" title="暂停 (空格)">❚❚</div>
<div id="touchHint">按住屏幕拖动来游动喵</div>
<div id="installTip">
  <div class="ii">📲</div>
  <div class="it" id="installText"></div>
  <div class="ix" id="installClose">✕</div>
</div>
<div id="rotateTip">
  <div class="ic">📱</div>
  <div class="tt">把手机横过来喵</div>
  <div class="dd">这游戏是横屏的<br>转一下手机就能玩啦～</div>
</div>

<!-- 主菜单 / 结算 -->
<div id="overlay" class="layer show">
  <div class="panel">
    <span class="badge" id="ovBadge">🐋</span>
    <h1 id="ovTitle">鲸鱼娘 · 深海米饭 Roguelite</h1>
    <p class="sub" id="ovText">
      带着本小姐在深海里游，自动喷水打怪，<br>
      吃米饭升级，每级三选一。活得越久，越离谱喵。
    </p>

    <div class="keys" id="ovKeys">
      <span class="key"><b>WASD / 方向键</b> 游动</span>
      <span class="key"><b>鼠标拖动 / 手指</b> 也能游</span>
      <span class="key"><b>空格</b> 暂停</span>
      <span class="key"><b>1 2 3</b> 选升级</span>
    </div>

    <div class="stats" id="ovStats">
      <div class="stat"><div class="v" id="stTime">0:00</div><div class="k">存活</div></div>
      <div class="stat"><div class="v" id="stKill">0</div><div class="k">击杀</div></div>
      <div class="stat"><div class="v" id="stLv">1</div><div class="k">等级</div></div>
      <div class="stat"><div class="v" id="stBest">0:00</div><div class="k">最佳</div></div>
    </div>

    <button id="ovBtn">开始游戏</button>

    <div class="meta">
      <div class="meta-title">鲸鱼币 <span class="coins" id="coinNum">0</span> · 局外永久成长</div>
      <div class="meta-list" id="metaList"></div>
      <button class="reset-btn" id="resetBtn">重置存档</button>
